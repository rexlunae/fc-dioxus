name: Check
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned toolchain and iOS simulator target
        run: |
          rustup show
          rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Install matching Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked
      - name: Install browser audit dependency
        run: npm ci
      - name: Require Chrome
        run: test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
      - name: Complete gate
        run: cargo xtask check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            target/renderer-results.json
            target/screenshots/
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --workspace --locked
