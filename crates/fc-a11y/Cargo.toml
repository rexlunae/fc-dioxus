[package]
name = "fc-a11y"
description = "Framework-independent static accessibility checks for HTML"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["accessibility", "wcag", "a11y", "html", "audit"]
categories = ["accessibility", "development-tools::testing", "web-programming"]

[features]
default = ["html"]
html = ["dep:html5ever", "dep:markup5ever_rcdom"]

[dependencies]
fc-tokens.workspace = true
html5ever = { workspace = true, optional = true }
markup5ever_rcdom = { workspace = true, optional = true }

[[bin]]
name = "fc-a11y"
path = "src/main.rs"
required-features = ["html"]

[lints]
workspace = true
