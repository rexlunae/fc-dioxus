[package]
name = "fc-dioxus"
description = "Typed, accessible Dioxus components over future-css"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
web = ["dep:web-sys"]
# Links navigate through the nearest dioxus-router Router instead of reloading the page.
router = ["dioxus/router"]
testing = ["dep:dioxus-ssr", "dep:fc-a11y"]

[dependencies]
dioxus.workspace = true
fc-tokens.workspace = true
dioxus-ssr = { workspace = true, optional = true }
fc-a11y = { workspace = true, features = ["html"], optional = true }
web-sys = { workspace = true, optional = true }
# BEGIN generated upstream models
# Generated by cargo xtask sync-upstream; change upstream.toml instead.
fc-core = { git = "https://github.com/rexlunae/future-css", rev = "1e7b529b58d19731528bf2ce78bbdc9d74d5070f", default-features = false }
fc-model = { git = "https://github.com/rexlunae/future-css", rev = "1e7b529b58d19731528bf2ce78bbdc9d74d5070f", default-features = false }
fc-rich-text = { git = "https://github.com/rexlunae/future-css", rev = "1e7b529b58d19731528bf2ce78bbdc9d74d5070f", default-features = false }
fc-select = { git = "https://github.com/rexlunae/future-css", rev = "1e7b529b58d19731528bf2ce78bbdc9d74d5070f", default-features = false }
fc-context-menu = { git = "https://github.com/rexlunae/future-css", rev = "1e7b529b58d19731528bf2ce78bbdc9d74d5070f", default-features = false }
fc-grid = { git = "https://github.com/rexlunae/future-css", rev = "1e7b529b58d19731528bf2ce78bbdc9d74d5070f", default-features = false }
fc-diff = { git = "https://github.com/rexlunae/future-css", rev = "1e7b529b58d19731528bf2ce78bbdc9d74d5070f", default-features = false }
fc-git = { git = "https://github.com/rexlunae/future-css", rev = "1e7b529b58d19731528bf2ce78bbdc9d74d5070f", default-features = false }
# END generated upstream models

[dev-dependencies]
dioxus-ssr.workspace = true
fc-a11y = { workspace = true, features = ["html"] }

[lints]
workspace = true
